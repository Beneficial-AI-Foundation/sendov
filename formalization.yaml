version: "0.3"

project:
  name: "Sendov's conjecture and the Phelps-Rodriguez conjecture"
  authors:
    - name: "Terence Tao"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "Terence Tao"

repository:
  role: substantive-development

classification:
  arxiv: [math.CV]
  msc2020: ["30C15", "30C10", "12D10"]

status: complete
fidelity: faithful
scope: >-
  Both conjectures in full generality: every complex polynomial of degree at
  least two with all zeroes in the closed unit disk, and every zero of it. No
  restriction on the degree beyond n >= 2, on the modulus or argument of the
  distinguished zero, or on multiplicities.

# ---------------------------------------------------------------------------
# Mathematical sources.
#
# This is a source-based formalization. The result is not new and is not
# claimed to be new: it formalizes the informal proof in the blog post below,
# which is itself a digestion of an argument already proved and formalized
# elsewhere. See related_formalizations for the earlier Lean work.
#
# NOTE TO REVIEWER: the blog post carries the full literature account. The
# entries below record the sources this formalization actually used to choose,
# state and justify the result.
# ---------------------------------------------------------------------------
sources:
  - title: "A digestion of the proof of Sendov's conjecture"
    authors: ["Terence Tao"]
    type: "web discussion"
    identifier: "https://terrytao.wordpress.com/"
    relationship: formalizes
    note: >-
      The informal proof that this development formalizes, including its new
      proof of Rubinstein's boundary theorem. The formalization follows its
      architecture closely and extends it from n >= 5 to n >= 2. At the time of
      submission this is a blog post rather than an archived preprint; the
      source text is sendov.tex and no more stable identifier exists yet.

  - title: "Research Problems in Function Theory (statement of Sendov's conjecture)"
    authors: ["W. K. Hayman"]
    type: "book"
    identifier: "https://zbmath.org/3254142"
    relationship: background
    note: >-
      Where the conjecture, due to Blagovest Sendov, was first recorded as a
      research problem. Used to fix the standard statement that Challenge.lean
      is checked against.

  - title: "Some properties of extremal polynomials for the Ilieff conjecture"
    authors: ["D. Phelps", "R. S. Rodriguez"]
    type: "paper"
    identifier: "https://zbmath.org/3386011"
    relationship: background
    note: >-
      The source of the strengthened conjecture with the equality
      classification, formalized here as SendovConjecture.phelps_rodriguez.

  - title: "On a problem of Ilyeff"
    authors: ["Z. Rubinstein"]
    type: "paper"
    identifier: "Pacific J. Math. 26 (1968), 159-161"
    relationship: background
    note: >-
      The boundary case |a| = 1, with the same equality classification. This
      development proves that case again from scratch, by a different argument
      (Sendov/Boundary.lean, from p''(1)/p'(1)); it does not transcribe
      Rubinstein's proof and does not depend on it.

  - title: "On a conjecture of Ilieff"
    authors: ["D. A. Brannan"]
    type: "paper"
    identifier: "Proc. Cambridge Philos. Soc. 64 (1968), 83-85"
    relationship: background
    note: "The cubic case, established independently here."

  - title: "On Ilyeff's conjecture"
    authors: ["A. Meir", "A. Sharma"]
    type: "paper"
    identifier: "Pacific J. Math. 31 (1969), 459-467"
    relationship: background
    note: >-
      Degree five, and the reciprocal identities of which the boundary identity
      used here is the k = nu = 1 specialization.

  - title: "Sendov's conjecture for sufficiently high degree polynomials"
    authors: ["Terence Tao"]
    type: "paper"
    identifier: "https://zbmath.org/7681950"
    relationship: background
    note: >-
      The earlier high-degree result. Its use of analytic continuation is what
      the digested argument replaces by an explicit finite check, which is why
      this development can be fully formalized.

  - title: "Sendov conjecture proof (ProofAtlas manuscript)"
    authors: ["Lech Mazur"]
    type: "other"
    identifier: "https://www.proofatlas.ai/papers/sendov-conjecture/"
    relationship: background
    note: >-
      The first complete proof of Sendov's conjecture for all n >= 2, produced
      with an AI tool. This development does not follow its argument; the
      corresponding Lean work is recorded under related_formalizations.

related_formalizations:
  - id: "https://www.proofatlas.ai/formalizations/sendov-conjecture/"
    relationship: independent
    note: >-
      An earlier and independent Lean formalization of Sendov's conjecture for
      all n >= 2, by Lech Mazur, reported there as 1160 files and 92816 lines
      with a single main theorem. This development shares no code with it, was
      written from the blog-post digestion rather than from that proof, and
      additionally proves the Phelps-Rodriguez equality classification, which
      that formalization does not state. The two are independent evidence for
      the same theorem; priority for the first machine-checked proof of
      Sendov's conjecture belongs to that work.

# ---------------------------------------------------------------------------
# How this was produced.
# ---------------------------------------------------------------------------
automation:
  methods:
    - method: "ai-agent"
      model: "Claude Opus 5 (Anthropic)"
      role: >-
        Wrote essentially all of the Lean source in this repository, working
        interactively in Claude Code under the direction and review of the
        author across many sessions: choosing the Lean formulations, finding
        and repairing proofs, and designing the certificate machinery. The
        author set the targets, supplied the informal proof and the staged
        plans in docs/, made the mathematical decisions, and reviewed the
        output as it was produced.
    - method: "ai-assisted"
      model: "unspecified; see the blog post"
      role: >-
        The informal proof being formalized was itself digested from earlier
        work with heavy AI assistance, as the blog post records. That work is a
        mathematical source here, not part of this repository.
    - method: "script-generation"
      role: >-
        The Bernstein certificates for degrees 5 to 100 in Sendov/FiniteRange/
        are emitted by the Python scripts in scripts/ (about 1300 lines). Those
        scripts are outside the trusted base: they write Lean source that Lean
        re-verifies from scratch, so a bug in them causes a build failure, not
        an unsound theorem. scripts/mutation_test.sh checks that the
        certificates are load-bearing.

review:
  status: self-assessed
  reviewers:
    - name: "Terence Tao"
  notes: >-
    The author directed and reviewed the development as it was produced. No
    external or independent review has been performed, and no mathematician
    other than the author has read the Lean source. Every step is checked by
    Lean, and scripts/audit.sh checks the trust conditions below.

# ---------------------------------------------------------------------------
# Limitations, stated so that a reader can calibrate the claim.
# ---------------------------------------------------------------------------
known_gaps: []

limitations:
  - >-
    No novelty is claimed. Sendov's conjecture was already proved and already
    formalized in Lean, independently, before this work; see
    related_formalizations. What is new here is the formalization of a
    different and much shorter argument, together with the Phelps-Rodriguez
    equality classification.
  - >-
    The proof depends on a computational component. For degrees 5 to 100 a
    numerical inequality is discharged by Bernstein certificates generated
    outside Lean and re-verified inside it; degrees 101 and above are handled
    analytically. This is about half the Lean source by line count.
  - >-
    The compared theorems depend on propext, Classical.choice and Quot.sound,
    and on nothing else. There is no sorry outside the two deliberate holes in
    Challenge.lean, no project-defined axiom, no native_decide, no unsafe, and
    no floating point in any statement or proof.
  - >-
    Challenge.lean states the result but does not prove it; that is the
    Comparator convention, and Solution.lean supplies the proofs.
